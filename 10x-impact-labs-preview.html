200+ projects on one platform, with full visibility from proposal to impact."},{slug:"ask-nyaaya",cat:"Legal",client:"Nyaaya (Vidhi Centre for Legal Policy)",title:"Enhancing Access to Legal Information through the “Ask Nyaaya” Program",desc:"A conversational legal-aid assistant that makes Indian law approachable for citizens, paralegals, and frontline workers.",img:ue.teaching,services:["AI Solutions","Product","Capacity Building"],stats:[{v:"<10s",l:"Avg response time"},{v:"100k+",l:"Queries handled"}],challenge:"Millions of Indians have legal questions but no affordable, trustworthy first port of call. Nyaaya had deep legal content but limited reach through static pages.",approach:"We re-architected the experience around real user questions, layered an AI assistant grounded in vetted legal content, and trained the team to maintain it.",solution:"An “Ask Nyaaya” chat experience that interprets plain-language queries, returns plain-language answers, and always points back to authoritative content and human help.",outcome:"Dramatic improvement in question-to-answer time and major uplift in citizens served per month, with the team in full control of the content."},{slug:"buland-bol",cat:"Livelihood",client:"Buland Bol partner",title:"Scaling Self-Paced Learning through the Buland Bol Training Chatbot",desc:"A WhatsApp-first training chatbot that delivers self-paced learning to thousands of frontline practitioners.",img:ue.villageGirl,services:["AI Solutions","Product","MEL"],stats:[{v:"10,000+",l:"Learners reached"},{v:"68%",l:"Completion rate"}],challenge:"In-person training was high-quality but impossible to scale across geographies and shifts. Practitioners needed a familiar, low-bandwidth channel.",approach:"We designed a modular curriculum delivered via a WhatsApp chatbot, with built-in assessments and a dashboard for trainers.",solution:"A production chatbot that meets learners where they already are, plus a trainer dashboard for cohort progress and intervention.",outcome:"Thousands of practitioners completing modules each month, with cost per learner an order of magnitude lower than instructor-led delivery."},{slug:"ai-mentor-chatbot",cat:"Livelihood",client:"Community volunteer programs",title:"Empowering Community Volunteers in 10+ States via an AI-Powered Mentor ChatBot",desc:"A conversational AI mentor giving frontline community volunteers on-demand guidance across 10+ Indian states.",img:ue.womenColor,services:["AI Solutions","Product","Capacity Building"],stats:[{v:"10+",l:"States reached"},{v:"AI-powered",l:"Mentor chatbot"}],challenge:"Frontline volunteers across 10+ states needed timely, consistent guidance, but human mentors couldn't scale to answer questions the moment they came up.",approach:"We designed an AI mentor grounded in the program's own playbooks, delivered through a familiar chat interface, with escalation to humans when needed.",solution:"A conversational AI mentor chatbot that answers volunteers' questions in their context, available on demand across geographies.",outcome:"Community volunteers in 10+ states get instant, consistent mentoring, freeing human mentors for the highest-value cases."},{slug:"mel-200-ngos",cat:"Livelihood",client:"Philanthropic funder consortium",title:"Improving 200+ Grassroots NGOs' Monitoring, Evaluation, and Learning Platform",desc:"A shared MEL platform serving 200+ grassroots NGOs across India, with funder-friendly reporting baked in.",img:ue.data,services:["MEL","Data","Capacity Building"],stats:[{v:"200+",l:"NGOs onboarded"},{v:"~40%",l:"Reporting time saved"}],challenge:"Grassroots NGOs were drowning in funder-specific reporting templates, with no time left for actual learning.",approach:"We designed a common data model across funders, built a multi-tenant MEL platform, and ran capacity programs so NGOs could own it.",solution:"A platform that ingests programmatic data once and produces both internal learning artefacts and funder-grade reports.",outcome:"200+ NGOs now operate on a shared backbone, with measurable time saved per reporting cycle and a learning network that didn't exist before."},{slug:"udhyam-livelihoods",cat:"Livelihood",client:"Udhyam Learning Foundation",title:"Improving Livelihoods and Earnings of Village-Level Entrepreneurs in Uttar Pradesh",desc:"Digital tools that help village-level entrepreneurs run better businesses and earn more.",img:ue.potter,services:["Technology Platforms","Data","MEL"],stats:[{v:"5,000+",l:"Entrepreneurs"},{v:"+22%",l:"Avg earnings lift"}],challenge:"Entrepreneurs in rural UP had ambition and informal networks, but no simple digital tooling to track sales, inventory, and customer relationships.",approach:"Co-design sprints with entrepreneurs to find the smallest useful tools, then progressive enhancement as adoption grew.",solution:"A lightweight Android-first toolkit and a coach dashboard that surfaces who needs help, when.",outcome:"Sustained earnings lift and a data backbone the program team uses to target support precisely."},{slug:"evidence-based-experimentation",cat:"Livelihood",client:"Multi-country consortium",title:"Improving Evidence-Based Decision Making for Changemakers through Tech-Enabled Experimentation Across Asia",desc:"A tech-enabled experimentation platform helping changemakers across Asia test, learn and scale interventions with rigour.",img:ue.womenColor,services:["Technology Platforms","MEL","Data"],stats:[{v:"6",l:"Countries"},{v:"40+",l:"Active experiments"},{v:"25",l:"Partner orgs"}],challenge:"Changemakers across Asia were running interventions with limited ability to test what works, compare results across geographies, or share evidence with funders in a structured way.",approach:"We co-designed a lightweight experimentation framework with the consortium, then built tooling for hypothesis tracking, baseline-endline measurement, and cross-program learning.",solution:"A multi-tenant web platform with a shared metrics library, experiment templates, and a
